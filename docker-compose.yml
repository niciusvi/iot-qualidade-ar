# ============================================================================
# School Air — stack completa e AUTOSSUFICIENTE (v2 / Fase 2)
#
# Sobe tudo que o sistema precisa, sem depender de infraestrutura externa:
#   db        → PostgreSQL (dados do monitor + database "evolution")
#   redis     → cache da Evolution API
#   evolution → gateway WhatsApp (instância própria desta stack)
#   backend   → API + motor de alertas
#   frontend  → dashboard (nginx)
#
# A mesma stack roda no Portainer residencial, em uma VPS, no Azure Container
# Apps ou no AWS ECS — basta o docker-compose.yml + variáveis de ambiente.
#
# No Portainer: Stacks → Add stack → Repository → URL deste repositório
#               + caminho docker-compose.yml → definir variáveis → Deploy.
# ============================================================================
services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-iaq}
      POSTGRES_USER: ${DB_USER:-iaq}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o database "evolution" na primeira inicialização do volume
      - ./db-init:/docker-entrypoint-initdb.d:ro
    # Sem "ports": o banco fica acessível SÓ pela rede interna da stack.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-iaq} -d ${DB_NAME:-iaq}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Cache volátil da Evolution — sem persistência e sem porta no host.

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USER:-iaq}:${DB_PASSWORD}@db:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      LANGUAGE: pt-BR
    ports:
      - "${EVOLUTION_PORT:-8081}:8080"   # Manager: http://localhost:8081/manager
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-iaq}:${DB_PASSWORD}@db:5432/${DB_NAME:-iaq}
      PORT: 3000
      RETENCAO_DIAS: ${RETENCAO_DIAS:-90}
      # --- Alertas WhatsApp (Fase 2) ---
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-escola}
      ALERTA_NUMEROS: ${ALERTA_NUMEROS:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      # --- Portal (Fase 3) ---
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ADMIN_USUARIO: ${ADMIN_USUARIO:-admin}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-}
      # Cloudflare Access — Service Token da frota de ESP32 (opcional)
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
      # DEV: se definida, os envios de WhatsApp saem por este webhook do n8n
      # em vez da Evolution da stack (produção deixa vazia)
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  evolution_instances:
