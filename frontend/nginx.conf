# Frontend School Air — nginx servindo o estático + proxy reverso da API.
# O dashboard sempre chama /api com caminho RELATIVO; aqui o nginx
# encaminha essas chamadas para o container "backend" da mesma stack.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Ingestão dos sensores (POST /api/sala<N>) NÃO passa por aqui: essa rota
  # é exclusiva do host do backend (sa-backend), protegido por Cloudflare
  # Access com Service Token. Bloquear no host público impede leitura forjada
  # sem credencial de borda.
  location ~ ^/api/sala\d+$ {
    return 403;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
