# Frontend School Air — nginx servindo o estático + proxy reverso da API.
# O dashboard sempre chama /api com caminho RELATIVO; aqui o nginx
# encaminha essas chamadas para o container "backend" da mesma stack.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # /api/sala<N> tem dois papéis: GET (dashboard lê a última leitura) e
  # POST (ESP32 grava). Só a INGESTÃO é exclusiva do host do backend
  # (sa-backend, atrás do Cloudflare Access) — por isso o limit_except
  # barra POST aqui no host público mas deixa o GET do portal passar.
  # Bug corrigido: um "return 403" para a rota inteira bloqueava também a
  # leitura e o dashboard ficava "Sem dados".
  location ~ ^/api/sala\d+$ {
    limit_except GET {
      deny all;
    }
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
